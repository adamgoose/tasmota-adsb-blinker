# Builds WLED (a pinned stable release) with the ADS-B Blinker usermod for each
# target, and publishes the binaries to a rolling "latest" GitHub Release.
name: Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create/replace the "latest" release

concurrency:
  group: firmware
  cancel-in-progress: true

env:
  WLED_VERSION: v16.0.1                    # WLED release tag to build against
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev       # classic ESP32
            release: ESP32
          - env: esp32c3dev     # ESP32-C3
            release: ESP32-C3
    steps:
      - name: Check out the usermod
        uses: actions/checkout@v4
        with:
          path: usermod

      - name: Check out WLED ${{ env.WLED_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: wled/WLED
          ref: ${{ env.WLED_VERSION }}
          path: WLED

      - name: Set up Node.js (WLED builds its web UI)
        uses: actions/setup-node@v4
        with:
          node-version-file: WLED/.nvmrc
          cache: npm
          cache-dependency-path: WLED/package-lock.json

      - name: Install web UI dependencies
        working-directory: WLED
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: WLED/requirements.txt

      - name: Install PlatformIO (WLED's pinned version)
        working-directory: WLED
        run: pip install -r requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ env.WLED_VERSION }}

      - name: Add the usermod to the build
        working-directory: WLED
        env:
          BASE_ENV: ${{ matrix.env }}
          USERMOD_DIR: ${{ github.workspace }}/usermod
        run: |
          # -DBEARSSL_SSL_BASIC would strip the ECDHE ciphers the APIs need (see wled/README.md)
          cat > platformio_override.ini <<EOF
          [platformio]
          default_envs = adsb

          [env:adsb]
          extends = env:${BASE_ENV}
          custom_usermods = \${env:${BASE_ENV}.custom_usermods}
            tasmota-adsb-blinker = symlink://${USERMOD_DIR}
          build_unflags = \${env:${BASE_ENV}.build_unflags} -DBEARSSL_SSL_BASIC
          EOF
          cat platformio_override.ini

      - name: Build firmware
        working-directory: WLED
        run: pio run -e adsb

      - name: Collect the binary
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          mkdir -p out
          bin=$(ls WLED/build_output/release/*.bin | head -1)
          name="WLED_${WLED_VERSION#v}_${RELEASE}_adsb-blinker.bin"
          cp "$bin" "out/$name"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.release }}
          path: out/*.bin
          if-no-files-found: error

  publish:
    name: Publish "latest" release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out

      - name: Checksums
        working-directory: out
        run: sha256sum *.bin | tee SHA256SUMS

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          {
            echo "Built automatically from \`${SHA:0:7}\` on WLED ${WLED_VERSION}."
            echo
            echo "| File | For |"
            echo "| --- | --- |"
            echo "| \`WLED_${WLED_VERSION#v}_ESP32_adsb-blinker.bin\` | Classic ESP32 (4 MB) |"
            echo "| \`WLED_${WLED_VERSION#v}_ESP32-C3_adsb-blinker.bin\` | ESP32-C3 (4 MB) |"
            echo
            echo "Upload through WLED's **Config → Security & Updates → Manual OTA update** (the file's chip must match the device's)."
            echo "Setup and settings: [wled/README.md](https://github.com/${REPO}/blob/${SHA}/wled/README.md)."
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create latest out/*.bin out/SHA256SUMS \
            --repo "$REPO" --target "$SHA" \
            --title "Latest build (WLED ${WLED_VERSION})" \
            --notes-file notes.md --latest
